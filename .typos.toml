# "Signes" is Ricardo Signes' surname, which typos wants to "correct" to
# "Signs".
[default.extend-words]
Signes = "Signes"

# LICENSE is verbatim legal boilerplate. It really does say
# "MERCHANTIBILITY", and we are not going to edit it.
[type.license]
extend-glob = ["LICENSE"]
[type.license.extend-words]
MERCHANTIBILITY = "MERCHANTIBILITY"
